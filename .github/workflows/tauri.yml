name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os-name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: windows
            runner: windows-latest
            arch: x86
            rust-target: i686-pc-windows-msvc
            artifact-debug: src-tauri/target/i686-pc-windows-msvc/debug/dnschecker.exe
            artifact-release: src-tauri/target/i686-pc-windows-msvc/release/dnschecker.exe

          - os-name: windows
            runner: windows-latest
            arch: x64
            rust-target: x86_64-pc-windows-msvc
            artifact-debug: src-tauri/target/x86_64-pc-windows-msvc/debug/dnschecker.exe
            artifact-release: src-tauri/target/x86_64-pc-windows-msvc/release/dnschecker.exe

          - os-name: windows
            runner: windows-latest
            arch: arm
            rust-target: aarch64-pc-windows-msvc
            artifact-debug: src-tauri/target/aarch64-pc-windows-msvc/debug/dnschecker.exe
            artifact-release: src-tauri/target/aarch64-pc-windows-msvc/release/dnschecker.exe

          - os-name: linux
            runner: ubuntu-latest
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
            artifact-debug: src-tauri/target/x86_64-unknown-linux-gnu/debug/dnschecker
            artifact-release: src-tauri/target/x86_64-unknown-linux-gnu/release/dnschecker

          - os-name: macos
            runner: macos-latest
            arch: arm
            rust-target: aarch64-apple-darwin
            artifact-debug: src-tauri/target/aarch64-apple-darwin/debug/dnschecker
            artifact-release: src-tauri/target/aarch64-apple-darwin/release/dnschecker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: ${{ matrix.os-name }}-${{ matrix.arch }}-${{ matrix.rust-target }}
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Build debug app
        run: npx tauri build --debug --no-bundle --target ${{ matrix.rust-target }}

      - name: Upload debug executable
        uses: actions/upload-artifact@v7
        with:
          name: dnschecker-${{ matrix.os-name }}-${{ matrix.arch }}-debug
          path: ${{ matrix.artifact-debug }}
          if-no-files-found: error

      - name: Build release app
        run: npx tauri build --no-bundle --target ${{ matrix.rust-target }}

      - name: Upload release executable
        uses: actions/upload-artifact@v7
        with:
          name: dnschecker-${{ matrix.os-name }}-${{ matrix.arch }}-release
          path: ${{ matrix.artifact-release }}
          if-no-files-found: error

      - name: Prepare release asset
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p release-assets

          NAME="dnschecker-${{ matrix.os-name }}-${{ matrix.arch }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            NAME="${NAME}.exe"
          fi

          cp "${{ matrix.artifact-release }}" "release-assets/${NAME}"

      - name: Upload executable to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
